<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="white" />
    <meta name="description" content="Интерактивная карта маршрутов и мест наблюдений научных экспедиций." />
    <title>Маршруты научных открытий</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <h1>Маршруты <span>научных открытий</span></h1>
          <div class="project-status">КАРТА В РАЗРАБОТКЕ · v0.3</div>
      </header>
      <div class="workspace">
        <aside class="expedition-panel" aria-label="Экспедиции">
          <div class="panel-heading">
            <h2>Экспедиции</h2>
            <p class="panel-caption">Исследования и маршруты</p>
          </div>
          <div id="expedition-list" class="expedition-list" aria-label="Список экспедиций" aria-live="polite">Загрузка...</div>
          <div id="expedition-details" class="expedition-details" aria-live="polite"></div>
        </aside>
        <section class="map-frame" aria-label="Интерактивная карта научных экспедиций">
          <div id="map"></div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
